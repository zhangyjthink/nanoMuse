name: Website & Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web App (Vite)
        working-directory: web
        run: |
          npm ci
          npm run build
          mkdir -p ../site/app
          cp -R ../nanomuse/server/static/. ../site/app/

      - name: Assemble Portal Entry Page
        run: |
          cat << 'HTML' > site/index.html
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
              <title>nanoMuse — 个人智能体在线工作台</title>
              <style>
                html, body {
                  margin: 0;
                  padding: 0;
                  width: 100%;
                  height: 100%;
                  overflow: hidden;
                  background: #0f172a;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                }
                iframe {
                  width: 100%;
                  height: 100%;
                  border: none;
                  display: block;
                }
              </style>
            </head>
            <body>
              <iframe src="https://demo.nanomuse.dev/" allow="clipboard-read; clipboard-write; microphone; camera; geolocation"></iframe>
            </body>
          </html>
          HTML

      - name: Assemble site/assets
        run: |
          mkdir -p site/assets/fonts site/assets/screens
          cp web/public/icon.svg web/public/mark.svg web/public/avatars/dragon-*.webp site/assets/ 2>/dev/null || true
          cp web/public/fonts/figtree-latin.woff2 web/public/fonts/figtree-latin-ext.woff2 web/public/fonts/OFL.txt site/assets/fonts/ 2>/dev/null || true
          cp docs/screenshots/*.png site/assets/screens/ 2>/dev/null || true
          cp docs/cover.png site/assets/cover.png 2>/dev/null || true

      - name: Build Docs
        working-directory: website
        env:
          DOCS_BASE: /nanoMuse/docs/
        run: |
          npm ci
          npm run docs:build
          rm -rf ../site/docs
          mkdir -p ../site/docs
          cp -R .vitepress/dist/. ../site/docs/

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

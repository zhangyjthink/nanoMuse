name: Website & Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web App (Vite)
        working-directory: web
        run: |
          npm ci
          npm run build
          mkdir -p ../site/app
          cp -R ../nanomuse/server/static/. ../site/
          cp -R ../nanomuse/server/static/. ../site/app/

      - name: Assemble site/assets
        run: |
          mkdir -p site/assets/fonts site/assets/screens
          cp web/public/icon.svg web/public/mark.svg web/public/avatars/dragon-*.webp site/assets/ 2>/dev/null || true
          cp web/public/fonts/figtree-latin.woff2 web/public/fonts/figtree-latin-ext.woff2 web/public/fonts/OFL.txt site/assets/fonts/ 2>/dev/null || true
          cp docs/screenshots/*.png site/assets/screens/ 2>/dev/null || true
          cp docs/cover.png site/assets/cover.png 2>/dev/null || true

      - name: Build Docs
        working-directory: website
        env:
          DOCS_BASE: /nanoMuse/docs/
        run: |
          npm ci
          npm run docs:build
          rm -rf ../site/docs
          mkdir -p ../site/docs
          cp -R .vitepress/dist/. ../site/docs/

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
